<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Scratch Pen Video Data Converter (Auto Width Mode)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e2e;
      color: #cdd6f4;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #181825;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 { color: #89b4fa; text-align: center; margin-top: 0; }
    .control-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
      background: #313244;
      padding: 15px;
      border-radius: 8px;
    }
    .control-full {
      grid-column: span 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      border-top: 1px solid #45475a;
      padding-top: 15px;
      margin-top: 5px;
    }
    label { font-weight: bold; color: #a6adc8; display: block; margin-bottom: 5px; }
    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #1e1e2e;
      color: #cdd6f4;
      box-sizing: border-box;
    }
    button {
      background: #89b4fa;
      color: #11111b;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }
    button:hover { background: #b4befe; }
    button:disabled { background: #585b70; cursor: not-allowed; }
    .drop-zone {
      border: 2px dashed #89b4fa;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      margin-bottom: 20px;
      background: #11111b;
      cursor: pointer;
    }
    .drop-zone:hover { background: #181825; }
    #previewCanvas {
      display: block;
      margin: 0 auto 20px;
      background: #000;
      border: 1px solid #45475a;
      max-width: 100%;
      height: auto;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background: #313244;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #a6e3a1;
      transition: width 0.1s;
    }
    #statusText { text-align: center; font-weight: bold; color: #f9e2af; }
  </style>
</head>
<body>

<div class="container">
  <h1>Scratch 描画データ変換ツール (横幅自動可変版)</h1>

  <div class="control-panel">
    <div>
      <label>モード指定</label>
      <select id="modeSelect">
        <option value="image">静止画モード</option>
        <option value="video" selected>動画モード</option>
      </select>
    </div>
    <div>
      <label>基準の高さ (Height 固定)</label>
      <select id="heightSelect">
        <option value="180" selected>180 (標準 16:9等)</option>
        <option value="270">270 (高画質)</option>
        <option value="135">135 (軽量)</option>
        <option value="90">90 (超軽量)</option>
      </select>
    </div>

    <div class="control-full" id="videoSettings">
      <div>
        <label>動画の長さ（カット上限）</label>
        <select id="durationSelect">
          <option value="30">最大 30秒</option>
          <option value="60">最大 1分</option>
          <option value="120">最大 2分</option>
          <option value="Infinity" selected>無制限（動画の最後まで）</option>
        </select>
      </div>
      <div>
        <label>フレームレート (FPS)</label>
        <select id="fpsSelect">
          <option value="10">10 fps</option>
          <option value="15" selected>15 fps</option>
          <option value="30">30 fps</option>
        </select>
      </div>
    </div>
  </div>

  <div class="drop-zone" id="dropZone">
    <p id="dropText">ここにファイル（画像・動画）をドラッグ＆ドロップ<br>またはクリックして選択</p>
    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
  </div>

  <canvas id="previewCanvas" width="320" height="180"></canvas>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <p id="statusText">待機中...</p>

  <button id="convertBtn" disabled>データ作成＆ダウンロード</button>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const dropText = document.getElementById('dropText');
  const modeSelect = document.getElementById('modeSelect');
  const heightSelect = document.getElementById('heightSelect');
  const durationSelect = document.getElementById('durationSelect');
  const fpsSelect = document.getElementById('fpsSelect');
  const videoSettings = document.getElementById('videoSettings');
  const previewCanvas = document.getElementById('previewCanvas');
  const ctx = previewCanvas.getContext('2d', { willReadFrequently: true });
  const convertBtn = document.getElementById('convertBtn');
  const progressFill = document.getElementById('progressFill');
  const statusText = document.getElementById('statusText');

  let loadedFile = null;

  modeSelect.addEventListener('change', () => {
    videoSettings.style.display = modeSelect.value === 'video' ? 'grid' : 'none';
  });

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#a6e3a1'; });
  dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#89b4fa'; });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.borderColor = '#89b4fa';
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    loadedFile = file;
    dropText.innerText = `選択完了: ${file.name}`;
    convertBtn.disabled = false;
    statusText.innerText = "準備完了";

    if (file.type.startsWith('video/')) {
      modeSelect.value = 'video';
      videoSettings.style.display = 'grid';
    } else if (file.type.startsWith('image/')) {
      modeSelect.value = 'image';
      videoSettings.style.display = 'none';
    }
  }

  // 元のメディアの縦横比を維持したまま、指定した高さを基準に横幅を自動計算する関数
  function calculateTargetDimensions(srcW, srcH, fixedH) {
    const aspect = srcW / srcH;
    const targetH = fixedH;
    const targetW = Math.round(targetH * aspect); // 比率を維持して横幅を自動算出
    return { targetW, targetH };
  }

  convertBtn.addEventListener('click', async () => {
    if (!loadedFile) return;
    convertBtn.disabled = true;
    
    if (modeSelect.value === 'image') {
      await processImage(loadedFile);
    } else {
      await processVideo(loadedFile);
    }

    convertBtn.disabled = false;
  });

  function drawAspectFit(element, srcW, srcH, targetW, targetH) {
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, targetW, targetH);

    const scale = Math.min(targetW / srcW, targetH / srcH);
    const drawW = srcW * scale;
    const drawH = srcH * scale;
    const drawX = (targetW - drawW) / 2;
    const drawY = (targetH - drawH) / 2;

    ctx.drawImage(element, drawX, drawY, drawW, drawH);
  }

  function getFrameTextChunk(targetW, targetH) {
    const imgData = ctx.getImageData(0, 0, targetW, targetH).data;
    const lines = [];

    for (let i = 0; i < imgData.length; i += 4) {
      const r = imgData[i].toString(16).padStart(2, '0').toUpperCase();
      const g = imgData[i + 1].toString(16).padStart(2, '0').toUpperCase();
      const b = imgData[i + 2].toString(16).padStart(2, '0').toUpperCase();
      lines.push(`0x${r}${g}${b}`);
    }
    return lines.join('\n') + '\n';
  }

  // 静止画処理
  function processImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const fixedH = Number(heightSelect.value);
        const { targetW, targetH } = calculateTargetDimensions(img.width, img.height, fixedH);
        
        previewCanvas.width = targetW;
        previewCanvas.height = targetH;

        drawAspectFit(img, img.width, img.height, targetW, targetH);
        
        // 1行目: 総フレーム数 (1)
        // 2行目: FPS (15)
        // 3行目: 自動計算された横幅 (targetW)
        const headerText = `1\n15\n${targetW}\n`;
        const textData = getFrameTextChunk(targetW, targetH);
        
        downloadChunksAsBlob([headerText, textData], `image_data_${targetW}x${targetH}.txt`);
        statusText.innerText = `静止画の変換が完了しました！ (解像度: ${targetW}×${targetH})`;
        progressFill.style.width = "100%";
        resolve();
      };
      img.src = URL.createObjectURL(file);
    });
  }

  // 動画処理
  function processVideo(file) {
    return new Promise((resolve) => {
      const video = document.createElement('video');
      video.src = URL.createObjectURL(file);
      video.muted = true;

      video.onloadedmetadata = async () => {
        const fixedH = Number(heightSelect.value);
        // 動画の元サイズから横幅を自動計算
        const { targetW, targetH } = calculateTargetDimensions(video.videoWidth, video.videoHeight, fixedH);

        previewCanvas.width = targetW;
        previewCanvas.height = targetH;

        const fps = Number(fpsSelect.value);
        const maxLimitSec = Number(durationSelect.value);
        const maxDuration = Math.min(video.duration, maxLimitSec);
        const totalFrames = Math.floor(maxDuration * fps);
        const frameInterval = 1 / fps;

        const blobChunks = [];
        
        // ヘッダー（上から3行）
        // 1行目: 総フレーム数
        // 2行目: FPSの数値 (10, 15, 30など)
        // 3行目: 自動計算された横幅の数値 (targetW)
        const headerText = `${totalFrames}\n${fps}\n${targetW}\n`;
        blobChunks.push(new Blob([headerText], { type: 'text/plain' }));

        statusText.innerText = `動画変換中... (解像度: ${targetW}×${targetH} / 全 ${totalFrames} フレーム)`;

        for (let frame = 0; frame < totalFrames; frame++) {
          video.currentTime = frame * frameInterval;
          await new Promise(r => video.onseeked = r);

          drawAspectFit(video, video.videoWidth, video.videoHeight, targetW, targetH);
          
          const frameText = getFrameTextChunk(targetW, targetH);
          blobChunks.push(new Blob([frameText], { type: 'text/plain' }));

          const percent = Math.round(((frame + 1) / totalFrames) * 100);
          progressFill.style.width = `${percent}%`;
          statusText.innerText = `フレーム処理中: ${frame + 1} / ${totalFrames} (${percent}%)`;

          if (frame % 5 === 0) await new Promise(r => setTimeout(r, 10));
        }

        statusText.innerText = "テキストファイル結合＆ダウンロード中...";
        downloadChunksAsBlob(blobChunks, `video_data_${fps}fps_${targetW}x${targetH}.txt`);
        statusText.innerText = "動画変換が完了しました！";
        resolve();
      };
    });
  }

  function downloadChunksAsBlob(chunks, fileName) {
    const finalBlob = new Blob(chunks, { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(finalBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
</script>

</body>
</html>
